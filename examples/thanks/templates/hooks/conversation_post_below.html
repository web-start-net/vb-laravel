<!-- wsthanks:conversation_post_below -->
{vb:set postNodeId, {vb:if "!empty($conversation['nodeid'])", {vb:raw conversation.nodeid}, {vb:raw nodeid}}}
<vb:if condition="!empty($postNodeId)">
<div class="ws-thanks-container b-button-group__item" data-nodeid="{vb:raw postNodeId}" id="ws-thanks-box-{vb:raw postNodeId}">
    <button type="button" class="b-button ws-thanks-btn" id="ws-thanks-btn-{vb:raw postNodeId}" data-nodeid="{vb:raw postNodeId}" aria-pressed="false" title="{vb:phrase wsthanks_thank}">
        <span class="ws-thanks-icon" aria-hidden="true">👍</span>
        <span class="ws-thanks-label" id="ws-thanks-label-{vb:raw postNodeId}">{vb:phrase wsthanks_thank}</span>
    </button>
    <span class="ws-thanks-count-wrapper" id="ws-thanks-count-wrapper-{vb:raw postNodeId}">
        <span class="ws-thanks-count" id="ws-thanks-count-{vb:raw postNodeId}">0</span>
        <span class="ws-thanks-count-label">{vb:phrase wsthanks_thanks}</span>
    </span>
    <span class="ws-thanks-msg" id="ws-thanks-msg-{vb:raw postNodeId}"></span>
</div>

<style>
.ws-thanks-container {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
    font-size: 13px;
    vertical-align: middle;
}
.ws-thanks-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    color: #4b5563;
    background-color: #f3f4f6;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.ws-thanks-btn:hover {
    background-color: #e5e7eb;
    border-color: #9ca3af;
    color: #1f2937;
}
.ws-thanks-btn.thanked, .ws-thanks-btn.active {
    background-color: #dbeafe;
    border-color: #93c5fd;
    color: #1d4ed8;
}
.ws-thanks-icon {
    font-size: 13px;
}
.ws-thanks-count-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #6b7280;
}
.ws-thanks-count {
    font-weight: 600;
    color: #374151;
}
.ws-thanks-msg {
    font-size: 12px;
    margin-left: 6px;
}
.ws-thanks-msg.error {
    color: #dc2626;
}
.ws-thanks-msg.loading {
    color: #6b7280;
}
</style>

<script>
(function() {
    var nodeId = {vb:raw postNodeId};
    var container = document.getElementById('ws-thanks-box-' + nodeId);
    if (!container) return;

    var btn = document.getElementById('ws-thanks-btn-' + nodeId);
    var labelSpan = document.getElementById('ws-thanks-label-' + nodeId);
    var countSpan = document.getElementById('ws-thanks-count-' + nodeId);
    var msgSpan = document.getElementById('ws-thanks-msg-' + nodeId);

    function getToken() {
        if (typeof vBulletin !== 'undefined' && vBulletin.securitytoken) {
            return vBulletin.securitytoken;
        }
        if (typeof SECURITYTOKEN !== 'undefined') {
            return SECURITYTOKEN;
        }
        var input = document.querySelector('input[name="securitytoken"]');
        return input ? input.value : '';
    }

    function getBaseUrl() {
        if (typeof vBulletin !== 'undefined' && vBulletin.baseurl) {
            return vBulletin.baseurl;
        }
        return '/';
    }

    function updateState(count, userThanked) {
        if (typeof count !== 'undefined' && countSpan) {
            countSpan.textContent = count;
        }
        if (btn && labelSpan) {
            if (userThanked) {
                btn.classList.add('thanked', 'active');
                btn.setAttribute('aria-pressed', 'true');
                labelSpan.textContent = '{vb:phrase wsthanks_unthank}';
            } else {
                btn.classList.remove('thanked', 'active');
                btn.setAttribute('aria-pressed', 'false');
                labelSpan.textContent = '{vb:phrase wsthanks_thank}';
            }
        }
    }

    // Toggle thank on click
    if (btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var token = getToken();

            if (msgSpan) {
                msgSpan.textContent = '';
                msgSpan.className = 'ws-thanks-msg';
            }

            btn.disabled = true;

            var body = new URLSearchParams();
            body.append('nodeid', nodeId);
            body.append('securitytoken', token);

            fetch(getBaseUrl() + 'ajax/api/wsthanks.thank/toggle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: body.toString()
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false;
                if (data.errors && data.errors.length) {
                    var errCode = data.errors[0][0] || 'error';
                    if (msgSpan) {
                        msgSpan.textContent = (errCode === 'no_permission') ? 'Please log in to thank posts.' : 'Error: ' + errCode;
                        msgSpan.className = 'ws-thanks-msg error';
                        setTimeout(function() { msgSpan.textContent = ''; }, 3000);
                    }
                    return;
                }
                if (data.success) {
                    updateState(data.count, data.thanked);
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                if (msgSpan) {
                    msgSpan.textContent = 'Request failed.';
                    msgSpan.className = 'ws-thanks-msg error';
                    setTimeout(function() { msgSpan.textContent = ''; }, 3000);
                }
            });
        });
    }

    // Fetch initial count & thank status
    fetch(getBaseUrl() + 'ajax/api/wsthanks.thank/get?nodeid=' + nodeId, {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (!data.errors && typeof data.count !== 'undefined') {
            updateState(data.count, data.user_thanked);
        }
    })
    .catch(function() {});
})();
</script>
</vb:if>
