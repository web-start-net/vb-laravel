name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, pdo, pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP Syntax Lint
        run: find src tests bin package examples -type f -name "*.php" -exec php -l {} +

      - name: Run Compiler AST & Error Handling Tests
        run: php tests/compiler-ast-test.php

      - name: Run ReadOnlyModel Safety Tests
        run: php tests/read-only-model-test.php

      - name: Run Provider Lifecycle Tests
        run: php tests/provider-lifecycle-test.php

      - name: Run CLI Generator & Packaging Tests
        run: php tests/cli-generators-test.php

      - name: Validate & Build Example Add-ons
        run: |
          php bin/vbl validate examples/bookmarks
          php bin/vbl build examples/bookmarks
          php bin/vbl validate examples/wsforms
          php bin/vbl build examples/wsforms
          if [ -d "examples/ratings" ]; then
            php bin/vbl validate examples/ratings
            php bin/vbl build examples/ratings
          fi
